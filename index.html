}

body {

}

.app {

}

header {

}

h1 {

}

.subtitle {

.status {

button {

}

.chat {

  margin: 22px 0;
}

.message {

  border-radius: 15px;

}

.vladimir {

}

.user {
  background: #176b49;

  text-align: right;
}

.input-area {
  display: flex;

  margin-bottom: 22px;
}

input {

  padding: 14px;
  border-radius: 14px;

  color: white;
  font-size: 16px;
}

.send {

}

.settings {
  background: #0d2b20;
  padding: 17px;

}

.settings h3 {

  color: #42dc91;
}

.settings label {
  display: block;
  margin: 14px 0 7px;
  color: #b6d2c2;
}

select {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #39805e;
  background: #194331;
  color: white;
  font-size: 15px;
}

.note {
  color: #8fac9b;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 15px;
}

button:active {
  transform: scale(0.97);
}

</style>
</head>

<body>

<header>
  <h1>ВЛАДИМИР</h1>

  <div class="status" id="status">Готов к работе</div>

<button class="greet" id="greet">

  <select id="voice">
    <option value="">Загрузка голосов...</option>
  </select>

  <div class="note">
    Доступные голоса зависят от браузера и устройства.
  </div>
</div>

</div>
